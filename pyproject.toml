[project]
name = "quant-risk"
version = "0.1.0"
description = "A股+港股全生命周期量化风控：波段推荐/单股分析/每日收盘工作流/回测"
readme = "README.md"
requires-python = ">=3.12"
# Semantica 为必须依赖（2026-09-09 用户确认，面向公开分发）：
# 默认 uv sync 即装全量（含 torch/transformers/faiss 等 AI 推理库，首次约 2.5GB）。
# 本项目实际只用到 semantica.reasoning 纯标准库 RETE，重型栈由官方包声明依赖带入。
dependencies = [
    "aiohttp==3.14.1",
    "mcp>=1.14",
    "mootdx>=0.11.7",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "quantdash>=0.1.0",
    "requests>=2.34.2",
    "semantica==0.6.8",
    "tickflow==0.1.24",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
